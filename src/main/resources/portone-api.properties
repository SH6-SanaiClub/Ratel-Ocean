# \uD3EC\uD2B8\uC6D0 API \uAE30\uBCF8 \uC815\uBCF4
portone.api.url=https://api.iamport.kr
portone.api.version=v1

# \uD3EC\uD2B8\uC6D0 API \uC778\uC99D \uC815\uBCF4
portone.api.key=${PORTONE_API_KEY}
portone.api.secret=${PORTONE_API_SECRET}
portone.imp.code=${PORTONE_IMP_CODE}

# \uACB0\uC81C \uC124\uC815
portone.payment.name.prefix=Sanai_Contract_
portone.payment.currency=KRW
portone.payment.language=ko

# \uC6F9\uD6C5 \uC124\uC815
portone.webhook.path=/payment/webhook
portone.webhook.enabled=true

# \uD658\uBD88 \uC124\uC815
portone.refund.reason.default=\uACE0\uAC1D \uC694\uCCAD\uC5D0 \uC758\uD55C \uD658\uBD88
portone.refund.checksum.enabled=true

# \uD0C0\uC784\uC544\uC6C3 \uC124\uC815 (\uCD08)
portone.api.connect.timeout=60000
portone.api.read.timeout=60000

# \uC7AC\uC2DC\uB3C4 \uC124\uC815
portone.api.retry.count=3
portone.api.retry.delay=1000

# \uB85C\uAE45 \uC124\uC815
portone.log.enabled=true
portone.log.level=INFO